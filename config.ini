; ============================================================
;  Assessor Integrado - configuração
;  Quase tudo aqui também se ajusta pela tela de Configurações.
;  Edite com o Bloco de Notas e salve. Comentário: linha com ';'.
; ============================================================


[geral]
; Pasta com tudo o que o programa produz e compartilha com a IA:
; Processos (os PDFs), Transcricoes (os DOCX) e os arquivos de contexto.
; Caminho relativo a esta pasta, ou absoluto (ex.: D:\Gabinete\Acervo).
; Evite pasta dentro do OneDrive: a sincronização atrapalha arquivo em uso.
pasta_acervo = Acervo
; Processos em segredo de justiça vão para cá, FORA do acervo
; compartilhado com a IA. Mesma regra de caminho.
pasta_sigilosos = Sigilosos
; Como o programa chama você na tela inicial.
nome_usuario = 

[unidade]
; Aparecem no cabeçalho das transcrições.
magistrado = 
cargo = 
vara = 
comarca = 
tribunal = 

[download]
; Processo cujo PDF já está na pasta de destino não é baixado de novo.
pular_baixados = true
; Processo em segredo de justiça vai para a pasta_sigilosos (recomendado).
separar_sigilosos = true
; Baixar também as gravações de audiência (ficam em _controle\midias, dentro
; da pasta do lote).
baixar_midias = false
; Mostrar a janela do navegador durante o download. O login por
; certificado e o login manual sempre mostram.
mostrar_navegador = false
; auto (Chrome, senão Edge, senão o Chromium do programa), chrome,
; msedge ou chromium.
navegador = auto
; Segundos entre um processo e outro. Não zere em listas grandes: rajada
; de acessos pode ser lida pelo portal como abuso.
pausa_entre_processos = 3
; Quantas vezes tentar um processo que falhou por instabilidade.
tentativas = 2
; Quanto esperar cada resposta do portal.
espera_segundos = 60
; Quanto esperar você concluir o login (código por e-mail, certificado).
espera_login_minutos = 10
; Guardar print e HTML da tela quando algo der errado (Logs\diagnostico).
salvar_diagnostico = true

[esaj]
; Como entrar no e-SAJ: senha, certificado ou manual.
login = senha

[eproc]
; Como entrar no eProc: senha ou manual.
login = senha
; Como montar o PDF: documentos (baixa peça por peça, na ordem dos eventos,
; com marcadores - padrão) ou completo (usa o "Download Completo" do
; eProc, que o tribunal gera em segundo plano; se demorar, volta para
; documentos).
modo = documentos
; No modo completo, quanto esperar o tribunal gerar o arquivo.
espera_completo_minutos = 8
; Perfil a escolher depois do login, quando o usuário tem mais de um
; (ex.: MAGISTRADO). Em branco = o programa pergunta na janela.
perfil = 

[transcricao]
; Modelo da transcrição ao vivo: base (computador fraco), small
; (recomendado) ou medium (computador forte, 8 núcleos ou mais).
modelo_ao_vivo = small
; Modelo da revisão final e das gravações: small, medium ou large-v3-turbo.
modelo_revisao = medium
; Ao encerrar a audiência, refazer a transcrição inteira com o modelo de
; revisão (mais precisa; leva alguns minutos).
refinar_ao_encerrar = false
; Na revisão final, separar as vozes automaticamente (se o componente
; estiver instalado).
separar_falantes = true
; Microfone. Em branco = o padrão do Windows.
dispositivo = 
; Guardar a gravação (FLAC) ao lado da transcrição, em _audio.
salvar_audio = true
; Mostrar [hh:mm:ss] em cada fala.
marcar_tempo = true
; Botões de quem está falando (F1, F2...), separados por ponto e vírgula.
falantes = Juiz(a);Promotor(a);Defensor(a);Advogado(a) do autor;Advogado(a) do réu;Testemunha;Parte;Outro
; Texto que orienta vocabulário e pontuação. MANTENHA ACENTUADO: o modelo
; imita a grafia do contexto; sem acento, a transcrição sai sem acento.
contexto = Transcrição de audiência judicial. Participam o Juiz de Direito, o Ministério Público, advogados, partes e testemunhas. Vocabulário forense: Meritíssimo, Excelência, contraditado, compromissada, depoimento, oitiva, instrução, exordial, preposto, reclamante, reclamado, autor, réu, petição inicial, contestação, sentença, agravo, tutela de urgência.
; Núcleos usados. 0 = metade dos disponíveis.
threads = 0

[interface]
; As chaves desta seção são gravadas pela própria tela.
assistente_concluido = false
tribunal = 
pasta_relacoes = 
ultimo_processo = 
tipo_audiencia = 

[compartilhar]
; Pasta do OneDrive ou do Google Drive para espelhar o acervo (os
; conectores do ChatGPT e do Claude leem de lá). Em branco = não espelha.
pasta_nuvem = 
; Espelhar sozinho ao fim de cada download e de cada transcrição.
espelhar_automaticamente = false
; Gerar a versão em texto dos autos (com a página e o documento marcados),
; que a IA lê muito melhor e mais barato que o PDF.
incluir_texto = true
